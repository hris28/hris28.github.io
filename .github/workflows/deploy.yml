name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so per-file git dates are available

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Top-level pages
          cp index.html about.html projects.html resume.html interests.html garden.html garden-entry.html _site/
          cp 404.html _site/404.html || true
          cp favicon.svg _site/favicon.svg || true

          # Shared assets
          cp -r css js images _site/
          if [ -d assets ]; then cp -r assets _site/assets; fi

          # Garden content: notes, posts, songs (exclude the Obsidian config folder)
          mkdir -p _site/garden
          cp -r garden/. _site/garden/
          rm -rf _site/garden/.obsidian

          # Tell GitHub Pages not to run Jekyll (so files like _template.html survive)
          touch _site/.nojekyll

      - name: Stamp each page with its real last-edited (git) date
        run: |
          stamp () {
            src="$1"; dest="$2"
            # Last commit date for the SOURCE file, formatted like "Thursday, 28 May 2026"
            d="$(git log -1 --format=%cd --date=format:'%A, %-d %B %Y' -- "$src" 2>/dev/null || true)"
            [ -z "$d" ] && d="$(date -u +'%A, %-d %B %Y')"
            sed -i "s|<span id=\"page-updated\"></span>|<span id=\"page-updated\">$d</span>|g" "$dest"
          }
          for f in index about projects resume interests garden garden-entry 404; do
            [ -f "_site/$f.html" ] && stamp "$f.html" "_site/$f.html"
          done
          for src in garden/posts/*.html garden/tools/*.html garden/projects/*.html; do
            [ -f "$src" ] && stamp "$src" "_site/$src"
          done

      - name: Verify key files exist
        run: |
          test -f _site/index.html
          test -f _site/garden.html
          test -f _site/garden-entry.html
          test -f _site/garden/tools/wcag-contrast-checker.html
          test -f _site/garden/tools/browser-fingerprinting.html
          echo "OK: required files present."

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
